<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATS Portal - Psikometrik & Aptitude Test System</title>
  
  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header & Navbar Portal -->
  <header class="portal-header">
    <div class="container header-container">
      <div class="brand">
        <h1 id="app-name">PATS Portal</h1>
        <p id="app-fullname">Psikometrik & Aptitude Test System</p>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container">
      <h2>Selamat Datang di Portal PATS APACA</h2>
      <p>Silakan pilih jenis modul tes yang ingin Anda ikuti dari daftar di bawah ini untuk memulai proses tes.</p>
    </div>
  </section>

  <!-- Main Content: Catalog 21 Tes -->
  <main class="container portal-main">
    <div id="test-catalog" class="test-catalog">
      <!-- Cards tes akan di-render secara dinamis oleh JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="portal-footer">
    <div class="container">
      <p>&copy; 2026 PATS Portal System by Briska Corporation Edu Tech. All rights reserved.</p>
    </div>
  </footer>

  <!-- Load Configuration File -->
  <script src="config.js"></script>

  <!-- Script Rendering Catalog Dynamic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Set Header App Title dari Config
      document.getElementById("app-name").innerText = PATS_CONFIG.appName;
      document.getElementById("app-fullname").innerText = PATS_CONFIG.appFullName;

      const catalogContainer = document.getElementById("test-catalog");
      const tests = PATS_CONFIG.tests;

      // Grouping Tes berdasarkan Kategori
      const categories = {};
      Object.keys(tests).forEach(key => {
        const test = tests[key];
        if (!categories[test.kategori]) {
          categories[test.kategori] = [];
        }
        categories[test.kategori].push(test);
      });

      // Render Section per Kategori
      let htmlContent = "";
      for (const [kategoriName, testList] of Object.entries(categories)) {
        htmlContent += `
          <section class="category-group">
            <h3 class="category-title">${kategoriName}</h3>
            <div class="grid-cards">
        `;

        testList.forEach(test => {
          htmlContent += `
            <div class="test-card">
              <div class="card-badge">${test.kode}</div>
              <h4 class="card-title">${test.namaSingkat}</h4>
              <p class="card-description">${test.namaResmi}</p>
              <div class="card-meta">
                <span>⏱️ ${test.durasiMenit} Menit</span>
              </div>
              <a href="tests/${test.folder}/index.html" class="btn-primary">Pilih Tes</a>
            </div>
          `;
        });

        htmlContent += `
            </div>
          </section>
        `;
      }

      catalogContainer.innerHTML = htmlContent;
    });
  </script>
</body>
</html>
