<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Akses - KK2 Pola Asuh Orang Tua</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

  <header class="portal-header">
    <div class="container header-container">
      <div class="brand">
        <h1>PATS PORTAL APACA</h1>
        <p>Modul KK2: APACA Parenting Style Inventory (APSI)</p>
      </div>
      <a href="../../index.html" class="btn-primary" style="width: auto; background-color: var(--secondary-color);">&larr; Kembali ke Portal</a>
    </div>
  </header>

  <main class="container portal-main">
    <div class="test-card" style="max-width: 500px; margin: 40px auto; padding: 30px;">
      <h3 style="margin-bottom: 6px; font-size: 1.25rem;">Verifikasi Orang Tua / Pengasuh</h3>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px;">
        Silakan masukkan Nama Lengkap dan Kode Akses / Token Ujian Anda untuk memulai tes.
      </p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="nama_lengkap">Nama Lengkap Orang Tua / Pengasuh</label>
          <input type="text" id="nama_lengkap" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="form-group">
          <label for="kode_akses">Kode Akses / Token Ujian</label>
          <input type="text" id="kode_akses" class="form-control" placeholder="Contoh: PATS-2026-X89K atau Token VIP" required autocomplete="off">
        </div>

        <div id="login-error" style="color: var(--danger-color); font-size: 0.875rem; margin-bottom: 14px; display: none; background-color: #fef2f2; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #fecaca;"></div>

        <button type="submit" id="btn-submit" class="btn-primary">Mulai Asesmen Pengasuhan</button>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>&copy; 2026 PATS Portal System by APACA Consulting. All rights reserved.</p>
    </div>
  </footer>

  <!-- Include Auth Module -->
  <script src="../../assets/js/auth.js"></script>
  
  <script>
    const CURRENT_TEST_CODE = "KK2"; // Kode Modul untuk Pola Asuh Orang Tua

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const nama = document.getElementById("nama_lengkap").value;
      const kodeAtauToken = document.getElementById("kode_akses").value;
      const errorDiv = document.getElementById("login-error");
      const btnSubmit = document.getElementById("btn-submit");

      // Reset Error Display & Status Tombol
      errorDiv.style.display = "none";
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Memverifikasi Akses...";

      // 1. Ambil Token Ujian VIP dari soal.json lokal (jika ada)
      let tokenVipSoal = "";
      try {
        const response = await fetch("soal.json");
        const soalData = await response.json();
        
        // Membaca token_ujian dari struktur root atau test_info
        tokenVipSoal = soalData.token_ujian || (soalData.test_info ? soalData.test_info.token_ujian : "");
      } catch (err) {
        console.warn("Gagal membaca token VIP dari file local soal.json:", err);
      }

      // 2. Jalankan Verifikasi Double-Track (Hybrid)
      const authResult = await PATS_AUTH.verifyParticipant(nama, kodeAtauToken, CURRENT_TEST_CODE, tokenVipSoal);

      if (authResult.success) {
        // Redirect langsung ke halaman pengerjaan CBT jika verifikasi sukses
        window.location.href = "cbt.html";
      } else {
        // Tampilkan pesan kesalahan dari sistem auth
        errorDiv.innerText = authResult.message;
        errorDiv.style.display = "block";
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Mulai Asesmen Pengasuhan";
      }
    });
  </script>
</body>
</html>
