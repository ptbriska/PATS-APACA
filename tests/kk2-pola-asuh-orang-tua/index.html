<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Akses - KK2 Pola Asuh Orang Tua</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

  <header class="portal-header">
    <div class="container header-container">
      <div class="brand">
        <h1>PATS PORTAL APACA</h1>
        <p>Modul KK2: APACA Parenting Style Inventory (APSI)</p>
      </div>
      <a href="../../index.html" class="btn-primary" style="width: auto; background-color: var(--secondary-color);">&larr; Kembali ke Portal</a>
    </div>
  </header>

  <main class="container">
    <div class="card-box">
      <h3 style="margin-bottom: 6px; font-size: 1.25rem;">Verifikasi Orang Tua / Pengasuh</h3>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px;">Silakan masukkan data diri dan Token Ujian untuk memulai tes.</p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="nama_lengkap">Nama Lengkap Orang Tua</label>
          <input type="text" id="nama_lengkap" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="form-group">
          <label for="kode_kegiatan">Kode Kegiatan</label>
          <input type="text" id="kode_kegiatan" class="form-control" placeholder="Contoh: PATS-2026-001" required>
        </div>

        <div class="form-group">
          <label for="token_ujian">Token Ujian (CBT Key)</label>
          <input type="text" id="token_ujian" class="form-control" placeholder="Masukkan Token Ujian" required>
        </div>

        <div id="login-error" style="color: var(--danger-color); font-size: 0.875rem; margin-bottom: 14px; display: none;"></div>

        <button type="submit" class="btn-primary">Mulai Asesmen Pengasuhan</button>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>&copy; 2026 PATS Portal System by Briska Corporation Edu Tech. All rights reserved.</p>
    </div>
  </footer>

  <script src="../../assets/js/auth.js"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nama = document.getElementById("nama_lengkap").value;
      const kode = document.getElementById("kode_kegiatan").value;
      const token = document.getElementById("token_ujian").value.trim();
      const errorDiv = document.getElementById("login-error");

      errorDiv.style.display = "none";

      const authResult = await PATS_AUTH.verifyParticipant(nama, kode);
      if (!authResult.success) {
        errorDiv.innerText = authResult.message;
        errorDiv.style.display = "block";
        return;
      }

      try {
        const response = await fetch("soal.json");
        const soalData = await response.json();

        if (token !== soalData.test_info.token_ujian) {
          errorDiv.innerText = "Token Ujian tidak valid untuk modul KK2.";
          errorDiv.style.display = "block";
          return;
        }

        window.location.href = "cbt.html";
      } catch (err) {
        errorDiv.innerText = "Gagal memproses verifikasi token.";
        errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
