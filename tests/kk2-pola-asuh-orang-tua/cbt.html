<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Asesmen - KK2 Pola Asuh Orang Tua</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    body { background-color: #0a0304; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .cbt-box { background: rgba(25, 5, 8, 0.8); border: 1px solid rgba(255, 30, 67, 0.3); border-radius: 16px; padding: 28px; backdrop-filter: blur(12px); max-width: 760px; margin: 30px auto; }
    .opt-label { display: flex; align-items: center; padding: 12px 16px; border: 1px solid rgba(255,30,67,0.25); border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; }
    .opt-label:hover { border-color: #ff1e43; background: rgba(255,30,67,0.1); }
  </style>
</head>
<body>

  <header style="padding: 16px 24px; border-bottom: 1px solid rgba(255,30,67,0.2); display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h3 id="participant-name" style="font-size: 1rem; color: #ff1e43;">-</h3>
      <p id="participant-info" style="font-size: 0.8rem; color: #d1a3a9;">-</p>
    </div>
    <div style="text-align: right;">
      <span style="font-size: 0.75rem; color: #d1a3a9;">Sisa Waktu:</span>
      <div id="cbt-timer" style="font-size: 1.3rem; font-weight: 800; color: #ff1e43;">15:00</div>
    </div>
  </header>

  <main class="container">
    <div class="cbt-box">
      <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <span id="question-number" style="font-weight: 700; color: #ff1e43;">Soal No. 1 dari 40</span>
      </div>

      <div id="question-text" style="font-size: 1.1rem; margin-bottom: 24px; line-height: 1.6;">Memuat pertanyaan...</div>

      <div id="options-container"></div>

      <div style="display: flex; justify-content: space-between; margin-top: 30px;">
        <button id="btn-prev" style="background: #475569; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Sebelumnya</button>
        <button id="btn-next" style="background: #2563eb; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Selanjutnya</button>
        <button id="btn-submit" style="background: #10b981; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; display: none;">Selesaikan Ujian</button>
      </div>
    </div>
  </main>

  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/cbt-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = PATS_AUTH.getSession();
      if (!user) { window.location.href = "index.html"; return; }

      document.getElementById("participant-name").innerText = user.nama_lengkap;
      document.getElementById("participant-info").innerText = `${user.asal_instansi} | Kode: ${user.kode_kegiatan}`;

      const res = await fetch("soal.json");
      const soalData = await res.json();

      const cbt = new CBTEngine({
        testCode: "KK2",
        timeLimitMinutes: soalData.test_info.durasi_menit,
        questions: soalData.questions,
        onTimeout: () => submitExam()
      });

      cbt.startTimer("cbt-timer");

      function renderQuestion() {
        const q = cbt.questions[cbt.currentIndex];
        document.getElementById("question-number").innerText = `Soal No. ${cbt.currentIndex + 1} dari ${cbt.questions.length}`;
        document.getElementById("question-text").innerText = q.pertanyaan;

        const answers = cbt.getAnswers();
        const selectedValue = answers[q.id];

        let optsHtml = "";
        soalData.options.forEach(opt => {
          const isChecked = selectedValue === opt.value ? "checked" : "";
          optsHtml += `
            <label class="opt-label">
              <input type="radio" name="opt_${q.id}" value="${opt.value}" ${isChecked} style="margin-right: 12px;" onchange="saveAnswer(${q.id}, ${opt.value})">
              <span>${opt.label}</span>
            </label>
          `;
        });
        document.getElementById("options-container").innerHTML = optsHtml;

        document.getElementById("btn-prev").style.display = cbt.currentIndex === 0 ? "none" : "inline-block";
        if (cbt.currentIndex === cbt.questions.length - 1) {
          document.getElementById("btn-next").style.display = "none";
          document.getElementById("btn-submit").style.display = "inline-block";
        } else {
          document.getElementById("btn-next").style.display = "inline-block";
          document.getElementById("btn-submit").style.display = "none";
        }
      }

      window.saveAnswer = (qId, val) => { cbt.saveAnswer(qId, val); };

      document.getElementById("btn-prev").addEventListener("click", () => { if (cbt.prevQuestion()) renderQuestion(); });
      document.getElementById("btn-next").addEventListener("click", () => { if (cbt.nextQuestion()) renderQuestion(); });
      document.getElementById("btn-submit").addEventListener("click", () => {
        if (Object.keys(cbt.getAnswers()).length < cbt.questions.length) {
          alert("Harap jawab seluruh 40 pertanyaan sebelum mengumpulkan!");
          return;
        }
        if (confirm("Apakah Anda yakin ingin menyelesaikan tes ini?")) { submitExam(); }
      });

      function submitExam() {
        cbt.stopTimer();
        sessionStorage.setItem("pats_answers_KK2", JSON.stringify(cbt.getAnswers()));
        cbt.clearSessionData();
        window.location.href = "result.html";
      }

      renderQuestion();
    });
  </script>
</body>
</html>
