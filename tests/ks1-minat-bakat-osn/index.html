<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Akses - PATS OTM Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

  <header class="portal-header">
    <div class="container header-container">
      <div class="brand">
        <h1 id="brand-app-name">PATS PORTAL</h1>
        <p id="brand-test-name">OSN Talent Mapping (OTM) Test</p>
      </div>
      <a href="../../index.html" class="btn-primary" style="width: auto; background-color: var(--secondary-color);">&larr; Kembali ke Portal</a>
    </div>
  </header>

  <main class="container portal-main">
    <div class="test-card" style="max-width: 500px; margin: 40px auto; padding: 30px;">
      <h3 id="form-title" style="margin-bottom: 6px; font-size: 1.25rem;">Verifikasi Peserta OTM</h3>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px;">
        Silakan masukkan Nama Lengkap dan Kode Akses / Token Ujian Anda untuk masuk ke sistem asesmen.
      </p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="nama_lengkap">Nama Lengkap Peserta</label>
          <input type="text" id="nama_lengkap" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="form-group">
          <label for="kode_akses">Kode Akses / Token Ujian / Token Master</label>
          <input type="text" id="kode_akses" class="form-control" placeholder="Masukkan Token Ujian" required autocomplete="off">
        </div>

        <div id="login-error" style="color: var(--danger-color); font-size: 0.875rem; margin-bottom: 14px; display: none; background-color: #fef2f2; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #fecaca;"></div>

        <button type="submit" id="btn-submit" class="btn-primary">Masuk Ujian Pilar I</button>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>&copy; 2026 PATS Portal System — OSN Talent Mapping. All rights reserved.</p>
    </div>
  </footer>

  <script src="../../assets/js/auth.js"></script>
  
  <script>
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const nama = document.getElementById("nama_lengkap").value;
      const kodeAtauToken = document.getElementById("kode_akses").value;
      const errorDiv = document.getElementById("login-error");
      const btnSubmit = document.getElementById("btn-submit");

      errorDiv.style.display = "none";
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Memverifikasi Akses...";

      // --- HARDCODE METADATA GLOBAL OTM DI SINI ---
      const testInfo = {
        kode: "KS1",
        nama_resmi: "OSN Talent Mapping (OTM) Test",
        nama_singkat: "OTM Test (3 Pilar)",
        versi: "Versi OTM 2.1 / 2026",
        token_ujian: "OTM2026",
        token_master: "PatsTestingKS1",
        psikolog_pj: "Dra. Fitriani Rahayu, M.Psi., Psikolog",
        SIPP: "2026-0819-PSI-01"
      };

      // Verifikasi sesi peserta menggunakan metadata hardcoded
      const authResult = await PATS_AUTH.verifyParticipant(nama, kodeAtauToken, "KS1", testInfo);

      if (authResult.success) {
        // Redirect ke CBT Pilar I
        window.location.href = "cbt1.html";
      } else {
        errorDiv.innerText = authResult.message;
        errorDiv.style.display = "block";
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Masuk Ujian Pilar I";
      }
    });
  </script>
</body>
</html>
